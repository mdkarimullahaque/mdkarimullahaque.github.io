<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Sahina ❤️</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The background image - Proposal on the beach */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Using a high-quality romantic beach proposal image */
            background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?ixlib=rb-1.2.1&auto=format&fit=crop&w=1353&q=80'); 
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3); /* Darkened slightly to make white text pop */
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            background: transparent; 
            padding: 20px;
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: #ffffff;
            font-size: 3rem;
            margin-bottom: 40px;
            text-shadow: 2px 4px 10px rgba(0,0,0,0.8);
            line-height: 1.2;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            min-height: 80px;
        }

        .btn {
            padding: 15px 45px;
            font-size: 1.4rem;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        #yesBtn {
            background-color: #28a745;
            color: white;
        }

        #noBtn {
            background-color: #dc3545;
            color: white;
            position: relative;
            z-index: 999;
        }

        /* Success Screen */
        .success-content {
            display: none;
            flex-direction: column;
            align-items: center;
            background: #f7d1e1; 
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            border: 5px solid #fff;
        }

        .yay-text {
            font-size: 3.5rem;
            font-weight: 900;
            color: #d63384;
            margin: 0;
        }

        .sub-text {
            font-size: 1.5rem;
            color: #555;
            margin: 15px 0;
        }

        .celebration-gif {
            width: 100%;
            max-width: 300px;
            border-radius: 20px;
            margin: 20px 0;
        }

        .love-footer {
            font-size: 1.4rem;
            color: #d63384;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="bg-image"></div>
    <div class="overlay"></div>

    <div class="container" id="mainWrapper">
        <div id="askContainer">
            <h1 id="question">Sahina, Will you be my Valentine? 💕</h1>
            <div class="buttons">
                <button id="yesBtn" class="btn" onclick="celebrate()">Yes!</button>
                <button id="noBtn" class="btn">No</button>
            </div>
        </div>

        <div id="successContainer" class="success-content">
            <h2 class="yay-text">💖 YAY!!! 💖</h2>
            <p class="sub-text">Best decision ever 😘</p>
            <img src="https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3M2xieTU0c2Vlb21ndGxsYzNzMjlrdTV5NGdqN2p2M2czMW40bzRqciZlcD12MV9naWZzX3NlYXJjaCZjdD1n/xd7EHNVClXWg35nn0q/giphy.gif" class="celebration-gif">
            <p class="love-footer">️Thank you for choosing me ❤️</p>
            
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const askContainer = document.getElementById('askContainer');
        const successContainer = document.getElementById('successContainer');

        const moveButton = () => {
            noBtn.style.position = 'fixed'; 
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);

            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        };

        noBtn.addEventListener('mouseenter', moveButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveButton();
        });

        function celebrate() {
            askContainer.style.display = 'none';
            successContainer.style.display = 'flex';
            noBtn.style.display = 'none';
        }
    </script>
</body>
</html>
